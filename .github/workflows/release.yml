name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# semantic-release creates the tag and GitHub release; no commit lands back on main.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs only when a version was published.
      - if: success() && steps.release.outputs.new_version != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: success() && steps.release.outputs.new_version != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: success() && steps.release.outputs.new_version != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tags
        if: success() && steps.release.outputs.new_version != ''
        run: |
          V="${{ steps.release.outputs.new_version }}"
          IMAGE=halitsever/girici-web-proxy
          {
            echo "list<<EOF"
            echo "$IMAGE:$V"
            echo "$IMAGE:${V%.*}"
            echo "$IMAGE:v${V%%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: success() && steps.release.outputs.new_version != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: true
          sbom: true
