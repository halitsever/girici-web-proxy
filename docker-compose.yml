services:
  girici:
    image: halitsever/girici-web-proxy:latest
    build: .
    restart: unless-stopped
    # Only this machine can reach Girici directly; use the https profile or your own reverse proxy for visitors.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: info
      GIRICI_DATA_DIR: /data
      # Set to 1 with the https or sites profile, so rate limits see each visitor instead of Caddy.
      GIRICI_TRUST_PROXY: ${GIRICI_TRUST_PROXY:-}
      # A fixed setup code instead of the one printed to the log; see .env.example.
      GIRICI_SETUP_TOKEN: ${GIRICI_SETUP_TOKEN:-}
      # Open-instance limits and /metrics, off while empty; see .env.example.
      GIRICI_BANDWIDTH_LIMIT: ${GIRICI_BANDWIDTH_LIMIT:-}
      GIRICI_DAILY_QUOTA: ${GIRICI_DAILY_QUOTA:-}
      GIRICI_METRICS_TOKEN: ${GIRICI_METRICS_TOKEN:-}
      GIRICI_POW_DIFFICULTY: ${GIRICI_POW_DIFFICULTY:-}
      # Subdomain mode, served by the sites profile; see docs/guide/subdomain-mode.md.
      GIRICI_SITE_DOMAIN: ${GIRICI_SITE_DOMAIN:-}
      GIRICI_SITE_SECRET: ${GIRICI_SITE_SECRET:-}
      # SOURCE_URL: https://github.com/you/your-fork
    volumes:
      - girici_data:/data

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [girici]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GIRICI_DOMAIN: ${GIRICI_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Use instead of the https profile, never beside it: both bind ports 80 and 443.
  caddy-sites:
    build:
      context: ./deploy/caddy-dns
      args:
        CADDY_DNS_MODULE: ${CADDY_DNS_MODULE:-github.com/caddy-dns/cloudflare}
    profiles: ["sites"]
    restart: unless-stopped
    depends_on: [girici]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GIRICI_SITE_DOMAIN: ${GIRICI_SITE_DOMAIN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./deploy/Caddyfile.sites:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  girici_data:
  caddy_data:
  caddy_config:
