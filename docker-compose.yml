services:
  girici:
    image: halitsever/girici-web-proxy:latest
    build: .
    restart: unless-stopped
    # Only this machine can reach Girici directly; use the https profile or your own reverse proxy for visitors.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: info
      GIRICI_DATA_DIR: /data
      # Set to 1 with the https profile, so rate limits see each visitor instead of Caddy.
      GIRICI_TRUST_PROXY: ${GIRICI_TRUST_PROXY:-}
      # A fixed setup code instead of the one printed to the log; see .env.example.
      GIRICI_SETUP_TOKEN: ${GIRICI_SETUP_TOKEN:-}
      # SOURCE_URL: https://github.com/you/your-fork
    volumes:
      - girici_data:/data

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [girici]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GIRICI_DOMAIN: ${GIRICI_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  girici_data:
  caddy_data:
  caddy_config:
