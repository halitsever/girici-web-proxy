# Fly.io config. Create the volume before the first deploy, or the admin account is lost on every restart:
#   fly launch --copy-config --no-deploy
#   fly volumes create girici_data --size 1
#   fly deploy
# SQLite lives on that one volume, so run a single machine.
app = "girici"
primary_region = "fra"

[build]
  image = "halitsever/girici-web-proxy:v2"

[env]
  GIRICI_DATA_DIR = "/data"
  # Fly's edge proxy is the one hop in front of the machine.
  GIRICI_TRUST_PROXY = "1"

[[mounts]]
  source = "girici_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A stopped machine drops open WebSockets and prints a new setup code when it starts again.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
